<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokéball - Pokémon</title>
  <!-- 
  ChatGPT Prompt 1: Find me a font suitable for a Pokemon themed website.
  ChatGPT Prompt 2: Draw a Pokéball using CSS.
  ChatGPT Prompt 3: Which commands can I use to move the Pokeball around the screen?
  ChatGPT Prompt 4: How can I make the Pokeball clickable?
  ChatGPT Prompt 5: Can you make the Pokeball shake when clicked?
  ChatGPT Prompt 6: Can you create a live clock that displays the current time using JavaScript?
  -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      font-family: 'Arial', sans-serif;
      background-image: url('https://images6.alphacoders.com/326/326467.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    input[type="checkbox"] {
      display: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 1s ease;
    }

    .pokeball {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(to bottom, red 0%, red 50%, white 50%, white 100%);
      border: 5px solid black;
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 1s ease;
    }

    .pokeball::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 10px;
      background-color: black;
    }

    .pokeball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background-color: white;
      border: 5px solid black;
      border-radius: 50%;
      transition: background-color 1s ease;
    }

    .pokeball .button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background-color: white;
      border: 3px solid black;
      border-radius: 50%;
      transition: background-color 1s ease;
      cursor: pointer;
      z-index: 10;
    }

    @keyframes shake {
      0%, 100% { transform: translateY(-200px) translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateY(-200px) translateX(-10px); }
      20%, 40%, 60%, 80% { transform: translateY(-200px) translateX(10px); }
    }

    input[type="checkbox"]:checked + .container {
      transform: translateY(-200px);
      animation: shake 1s ease-in-out 1s 2;
    }

    input[type="checkbox"]:checked + .container .pokeball::after,
    input[type="checkbox"]:checked + .container .pokeball .button {
      background-color: rgb(226, 37, 69);
      animation: resetColor 0.1s ease 3s forwards;
    }

    @keyframes resetColor {
      to {
        background-color: white;
      }
    }

    .caught-text {
      position: absolute;
      top: 25%;
      left: 65%;
      transform: translate(-50%, -50%);
      font-family: 'Press Start 2P', cursive;
      font-size: 24px;
      font-weight: bold;
      color: red;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    input[type="checkbox"]:checked ~ .caught-text {
      opacity: 1;
      transition-delay: 3s;
    }

    .login-container {
      position: absolute;
      top: 50%;
      width: 320px;
      background-color: #f9f9f9;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transition: opacity 1s ease-in-out;
      border-radius: 12px;
      border: 5px solid #ffcb05;
    }

    input[type="checkbox"]:checked ~ .login-container {
      opacity: 1;
      transition-delay: 4s;
    }

    .login-container h3 {
      font-family: 'Press Start 2P', cursive;
      color: #ff0000;
      font-size: 32px;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ffcb05;
      border-radius: 8px;
      font-size: 16px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #ffcb05;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }

    .clock {
      font-family: 'Press Start 2P', cursive;
      font-size: 20px;
      color: #ff0000;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <input type="checkbox" id="pokeball-toggle">
  <div class="container">
    <div class="clock" id="clock"></div>
    <label for="pokeball-toggle" class="pokeball">
      <div class="button"></div>
    </label>
  </div>
  <div class="caught-text">Caught!</div>
  <div class="login-container">
    <div class="poke-logo"></div>
    <h3>Trainer Login</h3>
    <form action="#">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    function updateClock() {
      const clock = document.getElementById("clock");
      const now = new Date();
      clock.innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.addEventListener('keydown', function(e) {
      if (e.key.toLowerCase() === 'h') {
        document.querySelectorAll('form').forEach(form => {
          form.style.display = form.style.display === 'none' ? 'block' : 'none';
        });
      }
    });
  </script>
</body>
</html>
